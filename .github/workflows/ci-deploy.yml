name: CI / Deploy

# Test runs on every push to main and on every pull request.
# Build + deploy run only for pushes to main (i.e. merges), so PRs are gated by
# tests but never touch the dev VM.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Don't cancel an in-flight deploy on main; do cancel superseded PR runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/schedule-irp

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: irp
          POSTGRES_PASSWORD: irp
          POSTGRES_DB: irp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U irp -d irp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://irp:irp@localhost:5432/irp
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.18"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --no-install-project
      - name: Lint (ruff)
        run: uvx ruff check .
      - name: Check migrations are complete
        run: uv run --no-sync python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: uv run --no-sync python manage.py test --verbosity 2

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_NAME,IMAGE_TAG
          script: |
            set -eu
            cd /opt/schedule-irp
            export IMAGE_NAME="${{ env.IMAGE_NAME }}"
            export IMAGE_TAG
            docker compose pull
            docker compose run --rm web python manage.py migrate --noinput
            docker compose up -d
            docker image prune -f
