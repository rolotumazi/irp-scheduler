name: schedule-irp

# Stack: web app + Postgres, with Caddy (automatic HTTPS) behind the `prod`
# profile. The worker and cron services are added in later phases.
#
# Dev:  `docker compose up --build`         (web on localhost:8000, no Caddy/TLS)
# Prod: set COMPOSE_PROFILES=prod + CADDY_DOMAIN in .env, then
#       `docker compose pull && docker compose up -d`  (Caddy serves 80/443).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-irp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irp}
      POSTGRES_DB: ${POSTGRES_DB:-irp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-irp} -d ${POSTGRES_DB:-irp}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    image: ${IMAGE_NAME:-schedule-irp}:${IMAGE_TAG:-latest}
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-only-change-in-prod}
      DATABASE_URL: ${DATABASE_URL:-postgres://irp:irp@db:5432/irp}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      SITE_URL: ${SITE_URL:-http://127.0.0.1:8000}
    # Loopback only: local dev reaches it at localhost:8000; in prod Caddy
    # proxies to it over the compose network, so it's never exposed publicly.
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]              # only runs when COMPOSE_PROFILES=prod
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # certificates — must persist across restarts
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
