<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Schedule IRP{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    header { border-bottom: 1px solid #ddd; padding-bottom: 1rem; margin-bottom: 2rem; }
    a { color: #0057b7; }
    .muted { color: #666; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; vertical-align: top; }
    th { border-bottom: 2px solid #ddd; }
    .filters { margin: 1rem 0; display: flex; gap: 1rem; align-items: end; flex-wrap: wrap; }
    .filters label { display: flex; flex-direction: column; font-size: 0.9rem; gap: 0.2rem; }
    ul.sessions { list-style: none; padding: 0; }
    ul.sessions li { padding: 0.6rem 0; border-bottom: 1px solid #eee; }
    ul.messages { list-style: none; padding: 0; }
    ul.messages li { padding: 0.5rem 0.8rem; border-radius: 4px; margin-bottom: 0.5rem; }
    ul.messages li.success { background: #e7f6e7; }
    ul.messages li.error { background: #fde7e7; }
    fieldset.day { margin: 0 0 1rem; }
    .slot { display: block; padding: 0.15rem 0; }
  </style>
</head>
<body>
  <header style="display: flex; justify-content: space-between; align-items: center;">
    <h1 style="margin: 0;"><a href="{% url 'interviews:home' %}" style="text-decoration: none; color: inherit;">Schedule IRP</a></h1>
    <nav>
      {% if user.is_authenticated %}
        <span>{{ user.email }}</span> &middot;
        <a href="{% url 'interviews:logout' %}">Sign out</a>
      {% else %}
        <a href="{% url 'interviews:login_request' %}">Sign in</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% if messages %}
      <ul class="messages">
        {% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
